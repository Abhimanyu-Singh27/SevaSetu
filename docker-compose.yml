services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sevasetu
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: sevasetu
    ports:
      - "5432:5432"
    volumes:
      - sevasetu-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sevasetu -d sevasetu"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - sevasetu-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sevasetu-postgres:
  sevasetu-redis: